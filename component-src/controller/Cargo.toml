[package]
name = "controller"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.91"
description = "Greentic component controller"
repository = "https://github.com/controller"
build = "build.rs"
authors = [
    "remote",
]

[package.metadata.component]
package = "greentic:component"

[package.metadata.component.target]
world = "greentic:component/component@0.6.0"

[lib]
crate-type = [
    "cdylib",
    "rlib",
]

[dependencies]
serde_json = "1"

[dependencies.serde]
version = "1"
features = [
    "derive",
]

[dependencies.greentic-interfaces-guest]
version = ">=1.1.0-0, <1.2.0-0"
default-features = false
features = [
    "component-v0-6",
]

[dependencies.greentic-types]
version = ">=1.1.0-0, <1.2.0-0"

[build-dependencies]
serde_json = "1"

[build-dependencies.greentic-types]
version = ">=1.1.0-0, <1.2.0-0"

[dev-dependencies]
serde_json = "1"
